      - OSS
    requires_context: [offshore, wind, cable, substation]
    fields: [title, description]
    active: true
    note: >-
      Inter-array cable and offshore substation. Both acronyms are ordinary words elsewhere -
      OSS is open-source software and a one-stop shop - so neither counts alone.

  - id: domain_onshore_renewables
    signal: domain
    label: onshore_renewables
    strength: medium
    aliases:
