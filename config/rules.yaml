      - submarine cable
      - electrification
    requires_context: []
    fields: [title, description]
    active: true
    note: >-
      "umspannwerk*" is a prefix because German inflects: 614160-2026, a Frankfurt substation
      refurbishment qualification system, says "Umspannwerke" and matched nothing, and only
      its CPV codes kept it out of the archive. The prefix catches that and
      Umspannwerksanierung; it does not catch "Bestandsumspannwerken", where the head noun is
      at the end of the compound. That limit is deliberate and is measured in
      docs/decisions/0006.

  - id: domain_grid_hvac
    signal: domain
    label: grid_transmission
    strength: medium
    aliases:
