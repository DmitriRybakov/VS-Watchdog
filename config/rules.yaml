    requires_context: [electrical, transmission, converter, grid, substation, cable]
    fields: [title, description]
    active: true
    note: >-
      Unqualified, HVAC means heating, ventilation and air conditioning - a building services
      contract, and the single most common false positive in the old keyword sheet. It counts
      as high-voltage alternating current only beside electrical transmission words.

