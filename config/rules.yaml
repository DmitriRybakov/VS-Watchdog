# Deterministic screening rules: vocabulary, aliases, required context words, CPV codes.
# Seeds the config_version table.
#
# READ THIS BEFORE EDITING.
#
# A rule is one canonical concept with its aliases, not a flat keyword list. Aliases are
# matched on the buyer's own words - every language variant of title-proc, description-proc
# and description-lot - never on TED's composed notice-title, which carries TED's own CPV
# label and would make an activity rule fire on every notice (docs/decisions/0002).
#
# KEYWORDS ARE EVIDENCE, NOT A VERDICT. Nothing here rejects a tender. A notice with no
# match at all routes to ASSESS: our vocabulary is English and TED titles arrive in every EU
# language. An exclusion routes to ARCHIVE_CANDIDATE only when no domain rule matched and no
# CPV code matched, and ARCHIVE_CANDIDATE means "skip the model call", not "drop it".
#
# Matching normalises for comparison only and never alters stored text: case, accents,
# hyphen-versus-space, subscript CO2 and H2. Matches are on token boundaries, so ECO2000
# does not match CO2. There is no stemming: write the forms you want, including
# native-language ones where they earn their place.
#
# strength: high | medium | supporting. A supporting term such as "energy" or "cable" is
# recorded as evidence but can never establish a domain on its own.
#
# requires_context: an ambiguous alias counts only when one of these words appears within
# matching.context_window characters of it IN THE SAME BLOCK. Never across blocks: two
# independent texts joined end to end create an adjacency that means nothing. The list
# applies to every alias in its rule, which is why an ambiguous acronym gets a rule of its
# own beside the plain-language rule it belongs to.
#
# note: is data, not a comment, so a justification survives the settings page rewriting this
# file. Corpus figures in the notes are counts of notices, from the 2,158 TED notices
# ingested for 1 July - 11 September 2026, measured on the screening blocks.
#
# A trailing * on a DOMAIN alias matches any word starting with it: umspannwerk* finds
# Umspannwerke and Umspannwerksanierung. It does NOT find Bestandsumspannwerken - a prefix
# still has to start a word - so German compounds with the head noun at the end stay out of
# reach. Use it where inflection is predictable - plurals, case endings, head-initial
# compounds - and not by default. It is rejected on an exclusion alias and on a context or
# companion word: a prefix widens recall on a domain term and widens archiving everywhere
# else, and those are opposite risks. See docs/decisions/0006.

version: 2
updated: 2026-09-12
owner: Entr Advisory & Decision Support

matching:
  # Characters either side of an alias, within one block, in which a required context word
  # must appear. A title is shorter than this, so on a title it means "in the same title".
  context_window: 300
  # Roughly how much surrounding source text to keep as the evidence quote for a match.
  evidence_chars: 120

cpv:
  # ARCHIVE GUARD ONLY. Per docs/decisions/0004 a CPV code is never evidence of relevance;
  # these codes only stop an exclusion from archiving a notice whose subject matter is
  # energy. Matched hierarchically against cpv_all - procedure and lot level - so 09300000
  # covers 09331200, exactly as TED's own filter does.
  #
  # Deliberately NOT the collection list in config/sources/ted.yaml. Every notice we hold
  # matched that list by construction, so reusing it here would make cpv_match true for
  # everything and ARCHIVE_CANDIDATE unreachable. These are subject-matter energy codes.
  archive_guard:
    - "09123000"   # Natural gas
    - "09300000"   # Electricity, heating, solar and nuclear energy (covers 0931-0933)
    - "45251000"   # Works for power plants
    - "65400000"   # Other sources of energy supply
    - "71314000"   # Energy and related services (covers 71314100/200/300)
    - "71323100"   # Electrical power systems design services
    - "76000000"   # Services related to the oil and gas industry

rules:

  # =========================================================================
  # DOMAIN - what the procured work is about. The primary filter.
  # =========================================================================

  - id: domain_hydrogen
    signal: domain
    label: hydrogen
    strength: high
    aliases:
      - hydrogen
      - green hydrogen
      - blue hydrogen
      - H2
      - electrolyser
      - electrolyzer
      - electrolysis
      - électrolyse*
      - elektrolyse*
      - wasserstoff*
      - hydrogène
      - waterstof*
      - idrogeno
      - hidrógeno
      - power-to-x
      - PtX
    requires_context: []
    fields: [title, description]
    active: true
    note: >-
      H2 is safe on a token boundary: it does not fire inside H2O or H2G. The native forms
      earn their place - 623022-2026, the Baden-Wuerttemberg electrolysis funding programme,
      says "Elektrolyse" and "Wasserstoff" and no English word for either. power-to-x sits
      here rather than among the medium terms because a PtX notice is a hydrogen notice.
      The prefixes cover Wasserstoffinfrastruktur and Elektrolyseanlage, not Gruenwasserstoff.

  - id: domain_renewable_fuels
    signal: domain
    label: renewable_fuels
    strength: high
    aliases:
      - ammonia
      - green ammonia
      - ammoniak*
      - methanol
      - e-methanol
      - e-fuel
      - e-fuels
      - synthetic fuel
      - biofuel
      - biodiesel
      - biogas*
      - biomethane
      - bioenergy
      - sustainable aviation fuel
      - renewable fuel
      - low-carbon fuel
    requires_context: []
    fields: [title, description]
    active: true
    note: >-
      Core in its own right, not adjacent to hydrogen: profile.yaml says these value chains
      usually embed hydrogen production and CO2 streams, so a biofuel notice is core.

  - id: domain_renewable_fuels_saf
    signal: domain
    label: renewable_fuels
    strength: high
    aliases:
      - SAF
    requires_context: [aviation, fuel, jet]
    fields: [title, description]
    active: true
    note: >-
      Sustainable aviation fuel, but only where the notice says so. Three letters that are
      also a surname, a Nordic word and an abbreviation for half a dozen other things.

  - id: domain_ccs
    signal: domain
    label: ccs_co2
    strength: high
    aliases:
      - carbon capture
      - carbon capture and storage
      - carbon storage
      - carbon dioxide
      - CCS
      - CCUS
      - kohlendioxid*
      - koldioxid*
    requires_context: []
    fields: [title, description]
    active: true
    note: >-
      626265-2026, Eidsiva Bioenergi's "CCS as a service" RFI, is the notice this rule exists
      for. It is also the notice the CPV list could not see until 45251000 was added.

  - id: domain_ccs_co2
    signal: domain
    label: ccs_co2
    strength: high
    aliases:
      - CO2
    requires_context: [capture, storage, transport, emission, carbon]
    fields: [title, description]
    active: true
    note: >-
      Unqualified CO2 is building-energy boilerplate: it appears in 617948-2026, a school
      structural-design job, and 619162-2026, a sustainability-coordination framework.
      Token-boundary matching also keeps it out of ECO2000 and similar product codes.

