      - eolic*
    requires_context: []
    fields: [title, description]
    active: true
    note: >-
      626958-2026, the Ville de Nimes roof-solarisation strategy study, carries no energy CPV
      at all - only 71241000, feasibility study. Text is the only thing that finds it.

  - id: domain_grid_transmission
    signal: domain
    label: grid_transmission
    strength: medium
    aliases:
      - power transmission
      - transmission network
      - transmission grid
      - HVDC
      - high voltage
      - substation
      - umspannwerk*
      - grid connection
      - grid reinforcement
