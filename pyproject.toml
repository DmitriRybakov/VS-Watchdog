[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Distribution name is entr-watchdog because "watchdog" on PyPI is the
# filesystem-watcher library. The import package stays "watchdog".
[project]
name = "entr-watchdog"
version = "0.1.0"
description = "Tender screening service for Entr Advisory & Decision Support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "typer",
    "pyyaml",
    "structlog",
    "tenacity",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "respx",
    "freezegun",
]
# Only needed to run against a real Azure OpenAI deployment. The default provider
# is "disabled" and needs none of this.
azure = [
    "openai",
]

[project.scripts]
watchdog = "watchdog.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
watchdog = [
    "web/templates/**/*",
    "web/static/**/*",
    "screening/prompts/*.md",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["watchdog"]
strict = true
warn_unused_configs = true

# PyYAML ships no type information and we are not adding a stub package for it.
# Only the two config loaders import it - sources/ted/config.py and
# screening/config.py - and each validates everything it reads.
[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

# The openai SDK is an optional extra, imported only inside llm/azure_openai.py.
# A checkout without it must still type-check.
[[tool.mypy.overrides]]
module = "openai.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
